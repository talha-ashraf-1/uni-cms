{% extends 'base.html' %}
{% block title %}Add Course — Admin{% endblock %}
{% block page_title %}Add New Course{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Add New Course</h1>
    <p>Create a new course and assign an instructor</p>
  </div>
  <a href="{{ url_for('admin_courses') }}" class="btn btn-outline">← Back</a>
</div>

<div class="form-card">
  <form method="POST" action="{{ url_for('admin_add_course') }}">
    <div class="form-group">
      <label>Course Name *</label>
      <input type="text" name="course_name" placeholder="e.g. Data Structures" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Credit Hours *</label>
        <input type="number" name="credits" placeholder="3" min="1" max="6" value="3" required>
      </div>
      <div class="form-group">
        <label>Department</label>
        <input type="text" name="department" placeholder="e.g. Computer Science">
      </div>
    </div>
    <div class="form-group">
      <label>Assign Instructor</label>
      <select name="instructor_id">
        <option value="">— Unassigned —</option>
        {% for i in instructors %}
        <option value="{{ i['instructor_id'] }}">{{ i['name'] }} ({{ i['department'] or 'No dept' }})</option>
        {% endfor %}
      </select>
    </div>
    <div style="display:flex; gap:10px; margin-top:8px;">
      <button type="submit" class="btn btn-red">Add Course</button>
      <a href="{{ url_for('admin_courses') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
